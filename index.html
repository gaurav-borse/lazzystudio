<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Lazzy Studio — considered objects, printed slowly. Coming soon." />
    <title>Lazzy Studio — Coming Soon</title>
    <style>
      :root {
        --paper: #f4efe6;
        --ink: #24201d;
        --clay: #c66c4b;
        --line: rgba(36, 32, 29, .18);
        --muted: rgba(36, 32, 29, .68);
      }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body.is-loading { overflow: hidden; }
      body.is-loading main { visibility: hidden; opacity: 0; }
      main { min-height: 100vh; overflow: hidden; opacity: 1; transition: opacity .45s ease; }
      .page-loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--paper); transition: opacity .45s ease, visibility .45s ease; }
      .page-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-ring { width: 34px; height: 34px; border: 2px solid rgba(36, 32, 29, .18); border-top-color: var(--clay); border-radius: 50%; animation: spin .8s linear infinite; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .wrap { width: min(1280px, calc(100% - 48px)); margin: 0 auto; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 0;
        border-bottom: 1px solid var(--line);
      }
      .wordmark { display: block; width: 150px; height: auto; }
      .wordmark img { display: block; width: 100%; height: auto; }
      .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--clay); animation: pulse 2s ease-in-out infinite; }
      .hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 10vw; padding: clamp(70px, 13vh, 150px) 0 100px; }
      .eyebrow { margin: 0 0 25px; color: var(--clay); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 650px; margin: 0; font-size: clamp(58px, 8vw, 120px); line-height: .88; letter-spacing: -.075em; font-weight: 800; }
      h1 em { color: var(--clay); font-style: normal; }
      .intro { max-width: 420px; margin: 34px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
      .form { display: flex; max-width: 470px; margin-top: 38px; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
      input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; }
      input::placeholder { color: var(--muted); }
      button { border: 0; background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; transition: color .2s ease; }
      button:hover { color: var(--clay); }
      .message { min-height: 20px; margin-top: 12px; color: var(--clay); font-size: 12px; }
      .logo-window { position: relative; min-height: 440px; border: 1px solid var(--line); background: #dcc8b1; overflow: hidden; }
      .logo-window::before { content: 'OBJECT / 01'; position: absolute; z-index: 2; top: 16px; left: 18px; color: var(--ink); font: 10px monospace; letter-spacing: .14em; }
      .logo-art { position: absolute; inset: 0; display: grid; place-items: center; }
      .logo-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .logo-window::after { content: 'OBJECTS FOR SLOWER LIVING.'; position: absolute; right: 18px; bottom: 18px; color: var(--ink); font-size: 10px; letter-spacing: .14em; }
      .lower { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; padding: 22px 0 30px; border-top: 1px solid var(--line); }
      .lower p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .coords { color: var(--muted); font: 10px monospace; letter-spacing: .1em; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 760px) {
        .wrap { width: min(100% - 32px, 560px); }
        header { padding: 20px 0; }
        .hero { display: flex; flex-direction: column; align-items: stretch; gap: 52px; padding: 74px 0 72px; }
        h1 { font-size: clamp(60px, 18vw, 100px); }
        .intro { font-size: 16px; }
        .logo-window { min-height: 330px; }
        .logo-art img { object-position: center; }
        .lower { align-items: flex-start; flex-direction: column; gap: 14px; }
      }
    </style>
  </head>
  <body class="is-loading">
    <div class="page-loader" id="page-loader" role="status" aria-label="Loading Lazzy Studio">
      <span class="loader-ring" aria-hidden="true"></span>
    </div>
    <main>
      <div class="wrap">
        <header>
          <a class="wordmark" href="/" aria-label="Lazzy Studio home">
            <img src="/LAZZY_WORDMARK_CUSTOM_SMOOTH.svg" alt="Lazzy Studio" />
          </a>
          <div class="status"><span class="dot" aria-hidden="true"></span> Making something</div>
        </header>
        <section class="hero" aria-labelledby="headline">
          <div>
            <p class="eyebrow">Independent 3D printing studio</p>
            <h1 id="headline">Objects for <em>slower</em> living.</h1>
            <p class="intro">Thoughtfully 3D printed home décor that brings calm, warmth and character to your space.</p>
            <form class="form" id="notify-form">
              <label class="sr-only" for="email">Your email address</label>
              <input id="email" name="email" type="email" placeholder="Your email address" required />
              <button type="submit">Keep me posted ↗</button>
            </form>
            <p class="message" id="message" role="status" aria-live="polite"></p>
          </div>
          <div class="logo-window" aria-label="A sculptural 3D printed lamp from Lazzy Studio"><div class="logo-art"><img id="hero-image" src="/lazzy-lamp.png" alt="A sculptural glowing 3D printed lamp" /></div></div>
        </section>
        <footer class="lower">
          <p>Launching soon.<br />Made slowly in India.</p>
          <div class="coords">19° 04′ N &nbsp; 72° 52′ E</div>
        </footer>
      </div>
    </main>
    <script>
      const loader = document.getElementById('page-loader');
      const heroImage = document.getElementById('hero-image');
      const revealPage = () => {
        document.body.classList.remove('is-loading');
        loader.classList.add('is-hidden');
      };
      if (heroImage.complete) revealPage();
      else heroImage.addEventListener('load', revealPage, { once: true });
      heroImage.addEventListener('error', revealPage, { once: true });

      const form = document.getElementById('notify-form');
      const message = document.getElementById('message');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const email = new FormData(form).get('email');
        if (!email) return;
        message.textContent = 'You’re on the list — see you soon.';
        form.reset();
      });
    </script>
  </body>
</html>
